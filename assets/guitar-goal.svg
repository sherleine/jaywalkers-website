<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Pixel-art red electric/acoustic guitar, designed as a tiny game sprite. -->
  <!-- tuning pegs -->
  <rect x="20" y="1" width="3" height="2" fill="#3b2418"/>
  <rect x="22" y="3" width="3" height="2" fill="#3b2418"/>
  <rect x="19" y="4" width="2" height="2" fill="#3b2418"/>
  <rect x="22" y="6" width="3" height="2" fill="#3b2418"/>
  <!-- headstock -->
  <rect x="16" y="2" width="7" height="7" fill="#8e302b"/>
  <rect x="15" y="4" width="5" height="7" fill="#a83b35"/>
  <rect x="18" y="2" width="5" height="2" fill="#9d3731"/>
  <!-- neck outline -->
  <rect x="15" y="8" width="5" height="13" fill="#3b2418"/>
  <rect x="16" y="8" width="3" height="13" fill="#4c4039"/>
  <rect x="17" y="9" width="1" height="12" fill="#d8c8b5"/>
  <!-- strings -->
  <rect x="17" y="9" width="1" height="18" fill="#e8dfd1"/>
  <rect x="18" y="9" width="1" height="18" fill="#c8b8a4"/>
  <!-- upper body -->
  <rect x="10" y="18" width="11" height="3" fill="#3b2418"/>
  <rect x="8" y="19" width="15" height="7" fill="#3b2418"/>
  <rect x="7" y="21" width="17" height="7" fill="#3b2418"/>
  <!-- red body -->
  <rect x="10" y="19" width="11" height="3" fill="#d94a42"/>
  <rect x="9" y="21" width="13" height="5" fill="#d94a42"/>
  <rect x="8" y="23" width="15" height="4" fill="#d94a42"/>
  <rect x="10" y="27" width="11" height="3" fill="#c83d38"/>
  <rect x="12" y="29" width="8" height="1" fill="#a72e2b"/>
  <!-- body highlights / cutaway -->
  <rect x="9" y="20" width="3" height="2" fill="#e85a50"/>
  <rect x="20" y="20" width="2" height="2" fill="#b93431"/>
  <rect x="8" y="24" width="2" height="3" fill="#c83d38"/>
  <!-- sound hole -->
  <rect x="14" y="22" width="5" height="5" fill="#3b2418"/>
  <rect x="15" y="23" width="3" height="3" fill="#241810"/>
  <!-- bridge -->
  <rect x="13" y="26" width="7" height="1" fill="#eee0cd"/>
  <rect x="14" y="27" width="5" height="1" fill="#5b4030"/>
</svg>
